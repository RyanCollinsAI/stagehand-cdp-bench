[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stagehand-cdp-bench"
version = "0.1.0"
description = "Reproducible browser-automation torture suite comparing brittle Playwright selectors, raw CDP/a11y locators, and Stagehand v4 on Browserbase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
